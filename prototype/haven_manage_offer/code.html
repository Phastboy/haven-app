<div class="app" id="app">
<header class="manage-header"><button type="button" id="back" class="header-back" aria-label="Back"><svg aria-hidden="true"><use href="#i-back"/></svg></button><h1>Manage offer</h1><span aria-hidden="true"></span></header>

<main hidden aria-label="Your offer details" class="content" id="offer-content" tabindex="-1">

<script>
(()=>{'use strict';
const hosted=!!window.HavenPrototype,host=window.HavenPrototype||{},$=id=>document.getElementById(id);
const sample={id:'aso-oke',title:'Hand-woven Aso Oke textile',category:'Craft & Making',price:120,currency:'USD',provider:{id:'olumide-adeleke',name:'Olumide Adeleke'},description:'Authentic hand-loomed Aso Oke strip-woven cotton and wild silk textile from Western Nigeria. Crafted using heritage loom techniques with subtle geometric motifs. Ideal for wall hangings, upholstery, or tailored garments.',location:[['Neighbourhood','Yaba Art District'],['City','Lagos'],['Country','Nigeria']]};
const offer=hosted?(host.offer||null):sample;
let user=hosted?(host.user||null):{id:sample.provider.id,name:sample.provider.name},timer;
const content=$('offer-content');
const gallery=$('gallery-track'),images=Array.isArray(offer?.images)?offer.images.slice(0,5):[];
let imageIndex=0;
function placeholder(){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('placeholder');svg.setAttribute('aria-hidden','true');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#i-image');svg.append(use);return svg;}
function renderGallery(){
  gallery.replaceChildren();
  const count=images.length;
  for(let index=0;index<Math.max(1,count);index++){
    const slide=document.createElement('figure');slide.className='gallery-slide';slide.setAttribute('role','group');slide.setAttribute('aria-roledescription','slide');slide.setAttribute('aria-label',count?`Image ${index+1} of ${count}`:'No images provided');
    const item=images[index],url=typeof item==='string'?item:item?.url||item?.src||'';
    if(/^(https?:|data:image\/|blob:|\/)/i.test(url)){
      const img=document.createElement('img');img.src=url;img.alt=item?.alt||`${offer.title}, image ${index+1} of ${count}`;img.draggable=false;
      img.onerror=()=>{img.replaceWith(placeholder());slide.setAttribute('aria-label',`Image ${index+1} of ${count} unavailable`);};slide.append(img);
    }else slide.append(placeholder());
    gallery.append(slide);
  }
  const multiple=count>1;gallery.tabIndex=multiple?0:-1;
  gallery.setAttribute('aria-label',multiple?'Offer images. Swipe or use left and right arrow keys to browse.':count?'Offer image':'No offer images provided');
  $('gallery-prev').hidden=!multiple;$('gallery-next').hidden=!multiple;$('gallery-count').hidden=!multiple;updateGallery();
}
function updateGallery(){
  $('gallery-count').textContent=`${imageIndex+1} / ${images.length}`;
  // Keep both controls focusable at the endpoints so browsing does not lose focus.
  $('gallery-prev').setAttribute('aria-disabled',String(imageIndex===0));
  $('gallery-next').setAttribute('aria-disabled',String(imageIndex>=images.length-1));
}
function selectImage(index){imageIndex=Math.max(0,Math.min(images.length-1,index));updateGallery();gallery.scrollTo({left:imageIndex*gallery.clientWidth,behavior:window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
$('gallery-prev').onclick=()=>selectImage(imageIndex-1);$('gallery-next').onclick=()=>selectImage(imageIndex+1);
gallery.addEventListener('keydown',event=>{if(images.length<2)return;let target;if(event.key==='ArrowLeft')target=imageIndex-1;else if(event.key==='ArrowRight')target=imageIndex+1;else if(event.key==='Home')target=0;else if(event.key==='End')target=images.length-1;else return;event.preventDefault();selectImage(target);});
gallery.addEventListener('scroll',()=>{if(!gallery.clientWidth||images.length<2)return;const next=Math.max(0,Math.min(images.length-1,Math.round(gallery.scrollLeft/gallery.clientWidth)));if(next!==imageIndex){imageIndex=next;updateGallery();}},{passive:true});
window.addEventListener('resize',()=>{gallery.scrollTo({left:imageIndex*gallery.clientWidth,behavior:'instant'});});
function ownsOffer(){return !!user?.id&&!!offer?.id&&user.id===offer.provider?.id;}
function notify(text){clearTimeout(timer);$('toast').textContent=text;$('toast').hidden=false;timer=setTimeout(()=>{$('toast').hidden=true},3200);}
function route(destination,extra={}){const detail={destination,offerId:offer?.id,returnTo:'manage-offer',...extra};try{if(host.navigate?.(detail)===true)return true;if(!window.dispatchEvent(new CustomEvent('haven:navigate',{detail,cancelable:true})))return true;}catch{notify('Unable to open this screen. Please try again.');return false;}notify('This screen is awaiting a prototype connection.');return false;}
function render(){
 const allowed=ownsOffer();content.hidden=!allowed;$('manage-actions').hidden=!allowed;$('access-state').hidden=allowed;
 for(const id of ['offer-title','category','price','currency','provider-name','initials','description'])$(id).textContent='';$('location').replaceChildren();gallery.replaceChildren();
 if(!allowed){$('access-title').textContent=!offer?'Offer unavailable':!user?'Sign in to manage your offer':'This offer belongs to someone else';$('access-copy').textContent=!offer?'The offer could not be found.':!user?'Use the account that owns this offer.':'You can view the public offer, but only its owner can manage it.';$('access-action').textContent=!offer?'Back':!user?'Sign in':'View public offer';return;}
 renderGallery();$('offer-title').textContent=offer.title;$('category').textContent=offer.category;$('price').textContent=offer.price===0?'Free':new Intl.NumberFormat('en',{maximumFractionDigits:2}).format(offer.price);$('currency').textContent=offer.price===0?'':offer.currency;$('provider-name').textContent=offer.provider.name;$('provider').setAttribute('aria-label','Open your profile');$('initials').textContent=offer.provider.name.split(/\s+/).filter(Boolean).slice(0,2).map(n=>n[0]).join('');$('description').textContent=offer.description||'';
 const entries=(offer.location||[]).filter(entry=>entry[1]);if(entries.length){for(const [label,value]of entries){const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;row.append(dt,dd);$('location').append(row);}}else $('location').textContent='Location information has not been provided.';
}
const deleteDialog=$('delete-dialog');$('delete').onclick=()=>{if(!ownsOffer())return;deleteDialog.showModal();$('keep-offer').focus();};$('keep-offer').onclick=()=>deleteDialog.close();deleteDialog.addEventListener('click',e=>{if(e.target===deleteDialog){const r=deleteDialog.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom)deleteDialog.close();}});$('confirm-delete').onclick=()=>{if(!ownsOffer())return;const confirmed=route('delete-offer',{confirmed:true,userId:user.id});if(!confirmed)notify('Deletion is awaiting a prototype connection. Your offer is still here.');deleteDialog.close();};$('back').onclick=()=>route('back');$('edit').onclick=()=>{if(ownsOffer())route('edit-offer')};$('view-public').onclick=()=>{if(ownsOffer())route('offer-detail')};$('provider').onclick=()=>{if(ownsOffer())route('my-profile')};$('access-action').onclick=()=>!offer?route('back'):!user?route('sign-in',{intent:'manage-offer'}):route('offer-detail');
window.HavenManageOffer={setUser(next){user=next||null;if(deleteDialog.open)deleteDialog.close();render();},offerDeleted(id){if(id===offer?.id){notify('Offer deleted.');route('my-offers',{intent:'deleted-offer'});}},getContext(){return {offerId:offer?.id,scrollTop:content.scrollTop,imageIndex}},restoreContext(context){if(ownsOffer()&&context?.offerId===offer.id){content.scrollTop=context.scrollTop||0;if(images.length)selectImage(context.imageIndex||0);}}};render();
})();
</script></body></html>
